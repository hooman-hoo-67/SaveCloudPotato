name: Build release artifacts

#
# Windows binaries cannot be produced on Linux, so each platform is
# built on itself. Tagged pushes attach the results to a release;
# manual runs leave them as artifacts, which is what makes it possible
# to test a build without first promising one.
#

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Fetch appimagetool
        run: |
          curl -sSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE on a runner; extracting is how appimagetool itself
          # says to run without it.
          ./appimagetool --appimage-extract > /dev/null
          echo "APPIMAGETOOL=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"

      #
      # A build that misreports its own version is worse than one with
      # no version at all, because the wrong answer is believed. Every
      # release from v0.1.0b2 to v0.1.0b5 called itself 0.1.0b1, which
      # made `savecloud --version` - and the build the Decky panel
      # shows - useless for telling any of them apart.
      #
      # So the tag has to agree with the code. Failing here costs a
      # retag; not failing here ships a binary that lies.
      #

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared="v$(python -c 'import savecloud; print(savecloud.__version__)')"
          if [ "$declared" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match" \
                 "savecloud.__version__, which says $declared."
            echo "Bump savecloud/__init__.py, then retag."
            exit 1
          fi
          echo "$declared"

      #
      # Qt's runtime libraries, which a runner does not have. PySide6
      # installs from a wheel either way, but importing QtWidgets links
      # libEGL - so without these the interface tests skip themselves,
      # and a gate that quietly covers none of the interface is worse
      # than no gate, because it reads as though it did.
      #

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      #
      # A release that ships code nobody ran the tests against is the
      # thing this workflow exists to prevent. Cheap enough to gate on.
      #

      - name: Test
        env:
          #
          # There is no display. The interface tests render into an
          # offscreen surface, which is what they do locally too.
          #
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Build
        run: packaging/build-appimage.sh

      - name: Check it runs
        run: |
          ./dist/SaveCloud-x86_64.AppImage --appimage-extract > /dev/null
          ./squashfs-root/AppRun --help
          ./squashfs-root/AppRun --json list

      - uses: actions/upload-artifact@v4
        with:
          name: SaveCloud-linux-x86_64
          path: dist/SaveCloud-x86_64.AppImage

  windows:
    runs-on: windows-latest

    #
    # Not required for a release. The Windows build has never been
    # exercised, and a platform nobody has asked for yet must not hold
    # up the one people are waiting on.
    #

    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/savecloud.spec

      - name: Check it runs
        run: |
          dist\savecloud\savecloud.exe --help
          dist\savecloud\savecloud.exe --json list

      - name: Compress
        run: Compress-Archive -Path dist\savecloud\* -DestinationPath SaveCloud-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SaveCloud-windows-x86_64
          path: SaveCloud-windows-x86_64.zip

  plugin:
    #
    # The Decky plugin, assembled the way it has to land on a Deck.
    #
    # Built here because a Steam Deck cannot build it: SteamOS ships no
    # Node and its /usr is read-only. Doing it by hand meant an npm
    # build and copying four things over SSH for every test, which is
    # how a Deck ends up running a plugin built from a different commit
    # than the AppImage beside it.
    #

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: decky/package-lock.json

      - name: Install
        working-directory: decky
        run: npm ci

      #
      # Separately from the build, which does not fail on type errors.
      #

      - name: Type-check
        working-directory: decky
        run: npm run typecheck

      - name: Build
        working-directory: decky
        run: npm run build

      #
      # Decky keys the frontend to its backend on the plugin's name, so
      # the directory has to match plugin.json exactly - a zip that
      # unpacks to the wrong name loads as a plugin that cannot talk to
      # itself.
      #
      # The sourcemap is left out. It is ninety times the size of the
      # bundle, and nothing on a Deck reads it.
      #

      - name: Assemble
        run: |
          NAME=$(python -c 'import json;print(json.load(open("decky/plugin.json"))["name"])')
          mkdir -p "package/$NAME/dist"
          cp decky/plugin.json decky/package.json decky/main.py "package/$NAME/"
          cp decky/dist/index.js "package/$NAME/dist/"
          (cd package && zip -r ../SaveCloud-decky-plugin.zip "$NAME")
          unzip -l SaveCloud-decky-plugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SaveCloud-decky-plugin
          path: SaveCloud-decky-plugin.zip

  release:
    #
    # Linux and the plugin. Windows runs alongside and its artifact is
    # collected if it finished, but the release does not wait on it -
    # unlike the plugin, which is exercised on every run and so is worth
    # failing a release over.
    #

    needs: [linux, plugin]

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          #
          # Anything that is not a plain vX.Y.Z is a prerelease, so a
          # beta is never presented as finished.
          #
          prerelease: ${{ contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          body: |
            ## Installing

            Download `SaveCloud-x86_64.AppImage`, make it executable,
            and run it:

            ```
            chmod +x SaveCloud-x86_64.AppImage
            ./SaveCloud-x86_64.AppImage
            ```

            To type `savecloud` in a terminal and get a menu entry:

            ```
            ./SaveCloud-x86_64.AppImage install
            ```

            One file is both the interface and the command line: opened
            on its own it shows a window, given arguments it behaves
            like the CLI. That is what makes it usable in Steam launch
            options:

            ```
            savecloud wrap <game-id> -- %command%
            ```

            `savecloud doctor -v` prints the correct line for your
            machine.

            ## Steam Deck: Gaming Mode

            `SaveCloud-decky-plugin.zip` is a
            [Decky Loader](https://decky.xyz) plugin for checking,
            synchronizing and resolving conflicts without leaving Gaming
            Mode. Install the AppImage first and run `savecloud install`,
            which is where the plugin looks for it.

            ```
            unzip SaveCloud-decky-plugin.zip
            sudo cp -r SaveCloud ~/homebrew/plugins/
            sudo systemctl restart plugin_loader
            ```

            The plugin and the AppImage in this release are built from
            the same commit. Mixing versions is the usual cause of a
            panel that loads but behaves oddly - the plugin's "Recent
            activity" row reports which build it found.

            Registering games stays in Desktop Mode.

            ## Reporting a problem

            `savecloud --version` reports the build and where it is
            installed. `savecloud doctor` reports the state of an
            installation.
