[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savecloud"
version = "0.1.0"
description = "Steam Cloud for everything."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer",
    "rich",
    "platformdirs"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyflakes"
]

[project.scripts]
savecloud = "savecloud.cli:app"

[tool.setuptools.packages.find]
include = ["savecloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Tests import shared fixtures via `from tests.conftest import ...`,
# which requires the repository root on sys.path.
pythonpath = ["."]
