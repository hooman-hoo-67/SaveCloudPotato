[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savecloud"
version = "0.1.0b1"
description = "Steam Cloud for everything."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer",
    "rich",
    "platformdirs"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyflakes"
]

# The desktop interface. Optional so the CLI still installs on a
# machine with no Qt - a headless server, or a Steam Deck running only
# the Decky plugin.
gui = [
    "PySide6-Essentials>=6.6"
]

[project.scripts]
savecloud = "savecloud.cli:app"

[project.gui-scripts]
savecloud-gui = "savecloud.gui.app:main"

[tool.setuptools.packages.find]
include = ["savecloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Tests import shared fixtures via `from tests.conftest import ...`,
# which requires the repository root on sys.path.
pythonpath = ["."]
